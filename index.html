// Verinin oluşturulduğu haftada (Pazartesi–Pazar) programa girilen KM aralıkları
function haftaPenceresi(){
  const n = new Date(D.olusturma);
  const pt = new Date(n); pt.setDate(n.getDate() - ((n.getDay() + 6) % 7)); pt.setHours(0, 0, 0, 0);
  const pz = new Date(pt); pz.setDate(pt.getDate() + 6); pz.setHours(23, 59, 59, 999);
  return { a: pt.getTime(), b: pz.getTime(), pt, pz };
}
const kmSayi = v => { const s = String(v ?? "").trim(); const m = s.match(/^(-?\d+)\s*\+\s*(\d+)$/); if(m) return +m[1] + +m[2] / 1000; const x = parseFloat(s.replace(",", ".")); return Number.isFinite(x) ? x : null; };
function haftaGirisleri(){
  const w = haftaPenceresi(), out = [];
  ISLER.forEach(j => { if(j.ekleme) return; (j.kmler || []).forEach(k => {
    if(!k.g || k.g < w.a || k.g > w.b || k.gz === 0) return;
    const s = kmSayi(k.a), e = kmSayi(k.e); if(s === null || e === null) return;
    out.push({ j, k, km: Math.abs(e - s) / (k.y ? 2 : 1) });
  }); });
  return out.sort((x, y) => y.k.g - x.k.g);
}
function buHafta(){
  const w = haftaPenceresi(), l = haftaGirisleri();
  const gun = d => `${p2(d.getDate())}.${p2(d.getMonth() + 1)}`;
  return `<div class="bh"><h5>Bu Hafta Girilen KM'ler <em>${gun(w.pt)} – ${gun(w.pz)} · ${l.length} giriş</em></h5><div class="bhl">${l.length ? l.map(x => {
    const d = new Date(x.k.g);
    return `<button class="bi" data-is="${esc(x.j.id)}"><span class="a"><b>${esc(x.j.ad)}</b><span>${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} · ${esc(x.k.s)} · ${esc(x.k.a)} – ${esc(x.k.e)}${x.k.y ? " · yarısı" : ""}</span></span><span class="k">+${f2(x.km)} km<span>${D.yil}: ${f2(sum(x.j, "b"))}</span></span></button>`;
  }).join("") : '<div class="bos">Bu hafta henüz KM girilmedi.</div>'}</div></div>`;
}

function mapUygula(){
  const inn = document.getElementById("mapin"), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");
  if(!inn || !w || !img) return;
  const W = w.clientWidth, H = w.clientHeight;
  inn.style.width = W + "px";
  const iw = W * mz.s, ih = img.offsetHeight * mz.s;
  mz.x = Math.min(0, Math.max(W - iw, mz.x));
  mz.y = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, mz.y));
  inn.style.transform = `translate(${mz.x}px,${mz.y}px) scale(${mz.s})`;
  const bw = (2 / mz.s) + "px";
  inn.querySelectorAll(".kutu").forEach(k => { k.style.borderWidth = bw; });
}
function mapZoom(f, cx, cy){
  const w = document.getElementById("mapwrap"); if(!w) return;
  const ns = Math.min(10, Math.max(1, mz.s * f));
  cx = cx ?? w.clientWidth / 2; cy = cy ?? w.clientHeight / 2;
  mz.x = cx - (cx - mz.x) * ns / mz.s; mz.y = cy - (cy - mz.y) * ns / mz.s; mz.s = ns;
  mapUygula();
}
function resimHazir(f){
  const img = document.getElementById("mapimg"); if(!img) return;
  if(img.complete && img.naturalWidth) f(); else img.addEventListener("load", f, { once: true });
}
function mapKur(){
  const w = document.getElementById("mapwrap"); if(!w) return;
  resimHazir(mapUygula);
  let t0 = null, d0 = 0, s0 = 1, m0 = null, last = 0;
  w.addEventListener("touchstart", e => {
    if(e.target.closest(".sheet, .zoom, .hust")) return;
    if(e.touches.length === 2){ const [a, b] = e.touches; d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); s0 = mz.s; m0 = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }; t0 = null; }
    else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y };
      const now = Date.now(); if(false && now - last < 300){ const r = w.getBoundingClientRect(); mapZoom(2, e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); } last = now; }
  }, { passive: true });
  w.addEventListener("touchmove", e => {
    if(e.target.closest(".sheet, .hust")) return;
    e.preventDefault();
    const r = w.getBoundingClientRect();
    if(e.touches.length === 2 && d0){ const [a, b] = e.touches; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); mapZoom((s0 * d / d0) / mz.s, m0.x - r.left, m0.y - r.top); }
    else if(e.touches.length === 1 && t0){ mz.x = e.touches[0].clientX - t0.x; mz.y = e.touches[0].clientY - t0.y; mapUygula(); }
  }, { passive: false });
  w.addEventListener("touchend", e => { if(e.touches.length === 0){ d0 = 0; t0 = null; } else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y }; d0 = 0; } });
  // fare (bilgisayarda açılırsa)
  let md = null, surukle = false;
  w.addEventListener("mousedown", e => { if(e.target.closest(".sheet, .zoom, .hust")) return; md = { x: e.clientX - mz.x, y: e.clientY - mz.y, ox: e.clientX, oy: e.clientY }; surukle = false; });
  window.onmousemove = e => { if(md){ if(Math.abs(e.clientX - md.ox) + Math.abs(e.clientY - md.oy) > 4) surukle = true; mz.x = e.clientX - md.x; mz.y = e.clientY - md.y; mapUygula(); } };
  window.onmouseup = () => { md = null; setTimeout(() => { surukle = false; }, 0); };
  w.addEventListener("click", e => { if(surukle){ e.stopPropagation(); e.preventDefault(); } }, true);
  w.addEventListener("wheel", e => { e.preventDefault(); const r = w.getBoundingClientRect(); mapZoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
}
function kutuyaGit(id){
  const j = byId(id), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");
  if(!j || !j.kutular.length || !w) return;
  resimHazir(() => {
    const k = j.kutular[0], W = w.clientWidth, H = w.clientHeight, ih = img.offsetHeight;
    // kutu ekranın yaklaşık üçte birini kaplasın
    mz.s = Math.min(10, Math.max(1.5, Math.min(W * 0.35 / (k[2] / 100 * W), H * 0.3 / (k[3] / 100 * ih))));
    const cx = (k[0] + k[2] / 2) / 100 * W, cy = (k[1] + k[3] / 2) / 100 * ih;
    mz.x = W / 2 - cx * mz.s; mz.y = H * 0.38 - cy * mz.s;
    mapUygula();
  });
}

// Katmanın simge rengi: beyaz olmayan ilk çizgi (yoksa nokta) rengi
function kmzRenk(k){

// ----- Drone uçuşları -----
// Süzme: zaman (son 1 / 3 ay / tümü) ve alan (işin hattına 1 km / tüm bölge).
// Aynı güzergâhta farklı zamanlarda yapılan uçuşlardan yalnız en yenisi
// gösterilir: eski uçuşun rotasının ~%70'i daha yeni bir rotaya 50 m'den
// yakınsa aynı güzergâh sayılır. Rotası olmayan uçuşlarda başlangıç noktası
// 60 m içindeyse aynı yer sayılır.
function hatKutusu(j){
  if(j._kutu) return j._kutu;
  let a0 = 90, a1 = -90, o0 = 180, o1 = -180;
  anaCizgiler(j).forEach(c => c.p.forEach(p => { a0 = Math.min(a0, p[0]); a1 = Math.max(a1, p[0]); o0 = Math.min(o0, p[1]); o1 = Math.max(o1, p[1]); }));
  const da = 0.0095, doo = 0.0095 / Math.max(0.3, Math.cos((a0 + a1) / 2 * Math.PI / 180));
  return (j._kutu = [a0 - da, a1 + da, o0 - doo, o1 + doo]);
}
function rotaOrtak(r, s){
  // r'nin örnek noktalarından kaçı s'ye 50 m'den yakın (oran)
  const lat = r[0][0], k = Math.cos(lat * Math.PI / 180), M = 111320;
  const xy = p => [(p[1] - r[0][1]) * k * M, (p[0] - lat) * M];
  const S = s.map(xy), R = r.map(xy);
  // rota boyunca eşit aralıklı örnek noktalar (yalnız köşeler değil)
  let boy = 0; for(let i = 1; i < R.length; i++) boy += Math.hypot(R[i][0] - R[i - 1][0], R[i][1] - R[i - 1][1]);
  const ara = Math.max(15, boy / 60), ornek = [R[0]];
  for(let i = 1; i < R.length; i++){ const A = R[i - 1], B = R[i], d = Math.hypot(B[0] - A[0], B[1] - A[1]); for(let t = ara; t < d; t += ara) ornek.push([A[0] + (B[0] - A[0]) * t / d, A[1] + (B[1] - A[1]) * t / d]); ornek.push(B); }
  let n = 0, ok = 0;
  for(const P of ornek){
    n++;
    let en = Infinity;
    for(let q = 1; q < S.length && en > 50; q++){
      const A = S[q - 1], B = S[q], dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
      let t = L2 ? ((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
      en = Math.min(en, Math.hypot(P[0] - A[0] - t * dx, P[1] - A[1] - t * dy));
    }
    if(en <= 50) ok++;
  }
  return n ? ok / n : 0;
}
const rotaKutu = r => { let a0 = 90, a1 = -90, o0 = 180, o1 = -180; r.forEach(p => { a0 = Math.min(a0, p[0]); a1 = Math.max(a1, p[0]); o0 = Math.min(o0, p[1]); o1 = Math.max(o1, p[1]); }); return [a0, a1, o0, o1]; };
const kesisir = (x, y) => !(x[1] < y[0] - 0.0006 || y[1] < x[0] - 0.0006 || x[3] < y[2] - 0.0008 || y[3] < x[2] - 0.0008);
function droneSuz(){
  const dr = D.katman && D.katman.drone; if(!dr || !kat) return [];
  const anahtar = kat.alan + "|" + kat.zaman;
  if(kat.suzOnbellek && kat.suzOnbellek.k === anahtar) return kat.suzOnbellek.l;
  const gun = ZAMAN[kat.zaman][1], sinirT = gun ? Date.now() - gun * 86400000 : 0;
  let l = dr.ucus.filter(u => !sinirT || (u.t && u.t >= sinirT));
  if(kat.alan === "is" && hatIs){
    const kt = hatKutusu(hatIs);
    kat.mesafe = kat.mesafe || new Map();
    l = l.filter(u => {
      if(u.a < kt[0] || u.a > kt[1] || u.o < kt[2] || u.o > kt[3]) return false;   // kaba eleme
      if(!kat.mesafe.has(u)){ const r = kmBul(hatIs, u.a, u.o); kat.mesafe.set(u, r ? r.d : Infinity); }
      return kat.mesafe.get(u) <= 1000;
    });
  }
  l = l.slice().sort((a, b) => (b.t || 0) - (a.t || 0));
  const tut = [];
  l.forEach(u => {
    if(u.r && u.r.length > 1 && !u._kutu) u._kutu = rotaKutu(u.r);
    const ayni = tut.some(x => {
      if(haversine([x.a, x.o], [u.a, u.o]) < 60) return true;
      return u.r && x.r && u.r.length > 1 && x.r.length > 1 && kesisir(u._kutu, x._kutu) && rotaOrtak(u.r, x.r) >= 0.7;
    });
    if(!ayni) tut.push(u);

  return tut;
}
function yasRenk(t){
  const g = t ? (Date.now() - t) / 86400000 : 9999;
  return g <= 31 ? "#ea580c" : g <= 92 ? "#f97316" : g <= 183 ? "#fb923c" : g <= 365 ? "#fdba74" : "#fed7aa";
}
function dronePop(u){

function seritCiz(){

function droneNoktalar(){

    }else{

        .on("click", () => { const pts = k.u.map(u => [u.a, u.o]); if(uc) uc.git(pts); else m.fitBounds(pts, { padding: [60, 60], maxZoom: 17 }); }).addTo(g);

// ---------- Yol Tarifi ----------
// İşin KMZ hattından başlangıç / bitiş ve size en yakın nokta bulunur; seçilen
// nokta Apple Haritalar ya da Google Haritalar'da yol tarifiyle açılır.
// Konum yalnızca bu ekranda kullanılır, hiçbir yere gönderilmez.
const ytBtn = j => j.hat ? `<button class="btn yt" data-yt="${esc(j.id)}">${IK("yt")}Yol Tarifi</button>` : `<button class="btn yt bos" data-kmzyok="${esc(j.id)}">${IK("yt")}Yol Tarifi</button>`;
const PIN = c => `<svg viewBox="0 0 24 24"><path d="M12 22s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z" fill="${c}"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>`;
function haversine(a, b){
  const R = 6371000, r = Math.PI / 180, dA = (b[0] - a[0]) * r, dO = (b[1] - a[1]) * r;
  const x = Math.sin(dA / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dO / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
const anaCizgiler = j => { const r = j.hat.cizgi.filter(c => !c.i); return r.length ? r : j.hat.cizgi; };
// Başlangıç / bitiş: adında KM yazan noktalardan en küçük ve en büyük KM;
// yoksa en uzun çizginin iki ucu
function uclar(j){
  const kms = [];
  j.hat.nok.forEach(n => { const x = /(\d+)\s*\+\s*(\d{3})/.exec(n[2] || ""); if(x) kms.push({ km: +x[1] + +x[2] / 1000, p: [n[0], n[1]] }); });
  if(kms.length >= 2){
    kms.sort((a, b) => a.km - b.km);
    return { bas: { p: kms[0].p, km: kms[0].km }, son: { p: kms[kms.length - 1].p, km: kms[kms.length - 1].km } };
  }
  const uz = l => l.p.reduce((s, q, i) => i ? s + haversine(l.p[i - 1], q) : 0, 0);
  const c = anaCizgiler(j).slice().sort((a, b) => uz(b) - uz(a))[0];
  if(!c) return null;
  return { bas: { p: c.p[0], km: null }, son: { p: c.p[c.p.length - 1], km: null } };
}
// Hatta size en yakın nokta (enlem/boylam) ve yaklaşık KM
function enYakin(j, lat, lon){

  altSayfa(IK("pdf"), "PDF Gönder", j.ad, "", "pdfbb", "pdfs");
  pdfCiz();
}
function pdfSecili(){ return pdfDurum.tek ? [pdfDurum.j] : ISLER.filter(x => pdfDurum.sec.has(x.id)); }
function pdfCiz(){
  const b = document.getElementById("pdfbb"); if(!b || !pdfDurum) return;
  const d = pdfDurum, sec = pdfSecili();
  const parOk = sec.some(parVar), itiOk = sec.some(itiVar);
  const q = fold(d.ara);
  const liste = ISLER.filter(x => !q || fold([x.ad, x.firma, x.il.join(" ")].join(" ")).includes(q));
  const bol = (k, ad, alt, ok) => `<label class="${ok ? "" : "yok"}"><input type="checkbox" data-pdfbol="${k}"${d.bol[k] && ok ? " checked" : ""}${ok ? "" : " disabled"}><span>${ad}<small>${alt}</small></span></label>`;
  b.innerHTML = `<div class="seg2"><button data-pdftek="1"${d.tek ? ' class="on"' : ""}>Bu iş</button><button data-pdftek="0"${d.tek ? "" : ' class="on"'}>Birden fazla iş</button></div>
${d.tek ? "" : `<div class="pdfara"><input id="pdfara" type="search" placeholder="İş ara…" value="${esc(d.ara)}" autocomplete="off"><button data-pdftum>${liste.every(x => d.sec.has(x.id)) && liste.length ? "Seçimi kaldır" : "Tümünü seç"}</button></div>
<div class="pdfis" id="pdfis">${liste.map(x => `<label><input type="checkbox" data-pdfis="${esc(x.id)}"${d.sec.has(x.id) ? " checked" : ""}><span>${esc(x.ad)}</span></label>`).join("") || '<div class="muted" style="padding:10px">İş bulunamadı.</div>'}</div>
<div class="muted" style="margin:6px 2px 12px">${d.sec.size} iş seçili</div>`}
<div class="bgrp" style="margin-top:${d.tek ? 4 : 0}px">BÖLÜMLER</div>
<div class="pdfbol">${bol("par", "İhale Bilgileri", parOk ? "Harita, Proje / İhale Bedeli ve Excel bilgileri" : "Seçili işlerde ihale bilgisi yok", parOk)}${bol("bilgi", "KM Bilgileri", "İhale uzunluğu, yapılan ve kalan km'ler", true)}${bol("iti", "İtinerer", itiOk ? "Her itinerer ayrı yatay sayfada" : "Seçili işlerde itinerer yok", itiOk)}</div>
${d.blob ? `<button class="go" data-pdfpaylas>${IK("paylas")}Paylaş / Gönder</button><div class="ytalt"><span>${esc(d.ad)}</span><button data-pdfonizle>Önizle</button></div>` : `<button class="go" data-pdfyap>${IK("pdf")}PDF Oluştur</button>`}
<div class="pdfdur" id="pdfdur"></div>`;
}
document.addEventListener("click", e => {
  if(!pdfDurum || !document.getElementById("pdfbb")) return;
  const d = pdfDurum;
  const t = e.target.closest("[data-pdftek]"); if(t){ d.tek = t.dataset.pdftek === "1"; d.blob = null; d.dosya = null; pdfCiz(); return; }
  if(e.target.closest("[data-pdftum]")){ const q = fold(d.ara), l = ISLER.filter(x => !q || fold([x.ad, x.firma, x.il.join(" ")].join(" ")).includes(q)); const hepsi = l.every(x => d.sec.has(x.id)); l.forEach(x => hepsi ? d.sec.delete(x.id) : d.sec.add(x.id)); d.blob = null; d.dosya = null; pdfCiz(); return; }
  if(e.target.closest("[data-pdfyap]")){ pdfYap(); return; }
  if(e.target.closest("[data-pdfpaylas]")){ pdfPaylas(); return; }
  if(e.target.closest("[data-pdfonizle]")){ if(d.blob) pdfOnizle(); return; }
});
document.addEventListener("change", e => {
  if(!pdfDurum) return;
  const d = pdfDurum;
  const i = e.target.closest("[data-pdfis]"); if(i){ i.checked ? d.sec.add(i.dataset.pdfis) : d.sec.delete(i.dataset.pdfis); d.blob = null; d.dosya = null; const y = document.getElementById("pdfis")?.scrollTop || 0; pdfCiz(); const n = document.getElementById("pdfis"); if(n) n.scrollTop = y; return; }
  const b = e.target.closest("[data-pdfbol]"); if(b){ d.bol[b.dataset.pdfbol] = b.checked; d.blob = null; d.dosya = null; pdfCiz(); }
});
document.addEventListener("input", e => {
  if(e.target.id === "pdfara" && pdfDurum){ pdfDurum.ara = e.target.value; const p = e.target.selectionStart; pdfCiz(); const n = document.getElementById("pdfara"); if(n){ n.focus(); n.setSelectionRange(p, p); } }
});
const pdfDurumYaz = m => { const x = document.getElementById("pdfdur"); if(x) x.textContent = m; };

// jsPDF ve yazı tipleri ilk kullanımda yüklenir (çevrimdışı önbellekte durur)
let pdfKutuphane = null;
function pdfHazirla(){
  if(pdfKutuphane) return pdfKutuphane;
  pdfKutuphane = (async () => {
    if(!window.jspdf) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "jspdf.min.js"; s.onload = ok; s.onerror = () => no(new Error("PDF bileşeni yüklenemedi")); document.head.appendChild(s); });
    const b64 = async u => { const r = await fetch(u); if(!r.ok) throw new Error("Yazı tipi yüklenemedi"); const a = new Uint8Array(await r.arrayBuffer()); let s = ""; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
    return { normal: await b64("DejaVuSans-tr.ttf"), kalin: await b64("DejaVuSans-Bold-tr.ttf") };
  })();
  pdfKutuphane.catch(() => { pdfKutuphane = null; });
  return pdfKutuphane;
}

// Yol Takip çizimini resme çevir: stiller öğelere işlenir, SVG → canvas → JPEG
async function itiResimleri(kod){
  const pr = D.iti.projeler[kod]; if(!pr) return [];
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-10000px;top:0;width:4000px;background:#fff";
  document.body.appendChild(host);
  host.attachShadow({ mode: "open" }).innerHTML = `<style>${itiCss()}</style><div class="kap">${pr.html}</div>`;
  const ozellik = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity", "stroke-dasharray", "stroke-linecap", "stroke-linejoin", "opacity", "font-size", "font-family", "font-weight", "font-style", "text-anchor", "dominant-baseline", "visibility", "display", "letter-spacing"];
  const svgs = [...host.shadowRoot.querySelectorAll("svg")].filter(x => !x.parentElement.closest("svg") && x.viewBox && x.viewBox.baseVal && x.viewBox.baseVal.width);
  const out = [];
  for(const s of svgs){
    const vb = s.viewBox.baseVal;
    s.style.width = vb.width + "px"; s.style.height = vb.height + "px";
    const kopya = s.cloneNode(true);
    const kaynak = [s, ...s.querySelectorAll("*")], hedef = [kopya, ...kopya.querySelectorAll("*")];
    kaynak.forEach((el, i) => { const cs = getComputedStyle(el); hedef[i].setAttribute("style", ozellik.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";")); });
    kopya.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    kopya.setAttribute("width", vb.width); kopya.setAttribute("height", vb.height);
    const metin = new XMLSerializer().serializeToString(kopya);
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error("İtinerer çizimi resme çevrilemedi")); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(metin); });
    const k = Math.min(3, 3600 / vb.width, 2400 / vb.height);
    const c = document.createElement("canvas"); c.width = Math.round(vb.width * k); c.height = Math.round(vb.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    out.push({ veri: c.toDataURL("image/jpeg", 0.9), w: c.width, h: c.height });
  }
  host.remove();
  return out;
}

const dosyaGuvenli = s => String(s).replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 120);
async function pdfYap(){
  const d = pdfDurum, isler = pdfSecili();
  const bol = { bilgi: d.bol.bilgi, par: d.bol.par && isler.some(parVar), iti: d.bol.iti && isler.some(itiVar) };
  if(!isler.length){ pdfDurumYaz("En az bir iş seçin."); return; }
  if(!bol.bilgi && !bol.par && !bol.iti){ pdfDurumYaz("En az bir bölüm seçin."); return; }
  const btn = document.querySelector("[data-pdfyap]"); if(btn){ btn.disabled = true; btn.textContent = "Hazırlanıyor…"; }
  try{
    await agirHazir();
    pdfDurumYaz("PDF bileşeni yükleniyor…");
    const font = await pdfHazirla();
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
    doc.addFileToVFS("dv.ttf", font.normal); doc.addFont("dv.ttf", "DV", "normal");
    doc.addFileToVFS("dvb.ttf", font.kalin); doc.addFont("dvb.ttf", "DV", "bold");
    doc.setFont("DV", "normal");
    doc._bos = true;
    for(let n = 0; n < isler.length; n++){
      pdfDurumYaz(`Hazırlanıyor… ${n + 1} / ${isler.length}`);
      await pdfIs(doc, isler[n], bol);
    }
    pdfCerceve(doc);
    const t = new Date(), tarihS = `${p2(t.getDate())}.${p2(t.getMonth() + 1)}.${t.getFullYear()}`;
    let ad = isler.length === 1 ? isler[0].ad : `${isler[0].ad} ve ${isler.length - 1} iş daha`;
    d.ad = dosyaGuvenli(`${ad} (${tarihS})`) + ".pdf";
    // Paylaşılacak dosya ayrı baytlardan, önceden hazırlanır: önizleme için
    // açılan blob: adresine bağlı olmasın (iPhone aksi hâlde WhatsApp'a
    // dosyanın yanında "blob:https://…" linkini de gönderiyor).
    const bytes = doc.output("arraybuffer");
    d.blob = new Blob([bytes.slice(0)], { type: "application/pdf" });
    d.dosya = new File([bytes.slice(0)], d.ad, { type: "application/pdf" });
    pdfCiz();
    pdfDurumYaz(`PDF hazır (${Math.max(1, Math.round(d.blob.size / 1024))} KB). Göndermek için Paylaş'a dokunun.`);
  }catch(err){
    if(btn){ btn.disabled = false; btn.innerHTML = IK("pdf") + "PDF Oluştur"; }
    pdfDurumYaz("PDF oluşturulamadı: " + err.message);
  }
}
// Uygulama içi PDF önizleme (pdf.js): sayfalar uygulamanın içinde resim
// olarak çizilir; tarayıcının PDF görüntüleyicisi (ve onun paylaş düğmesi)
// hiç açılmaz. Paylaşım yalnız "Paylaş / Gönder" ile yapılır.
let pdfjsSoz = null;
function pdfjsHazir(){
  if(window.pdfjsLib) return Promise.resolve();
  if(!pdfjsSoz){
    pdfjsSoz = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "pdf.min.js"; sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js"; ok(); }; sc.onerror = () => no(new Error("Önizleme bileşeni yüklenemedi")); document.head.appendChild(sc); });
    pdfjsSoz.catch(() => { pdfjsSoz = null; });
  }
  return pdfjsSoz;
}
async function pdfOnizle(){
  const d = pdfDurum; if(!d || !d.blob) return;
  const ov = document.createElement("div"); ov.className = "pon"; ov.id = "pon";
  ov.innerHTML = `<div class="pon-ust"><button data-ponkapat>${IK("x")}Kapat</button><b>${esc(d.ad.replace(/\.pdf$/, ""))}</b><span class="pon-z"><button data-ponz="-1" aria-label="Uzaklaştır">−</button><button data-ponz="1" aria-label="Yakınlaştır">+</button></span></div>
<div class="pon-govde" id="pon-govde"><div class="pon-yuk">Önizleme hazırlanıyor…</div></div>
<div class="pon-alt"><button class="go" data-ponpaylas>${IK("paylas")}Paylaş / Gönder</button></div>`;
  document.body.appendChild(ov);
  let olcek = 1, belge = null, ciziliyor = 0;
  const ciz = async () => {
    const no = ++ciziliyor, g = document.getElementById("pon-govde"); if(!g || !belge) return;
    const gen = (g.clientWidth - 16) * olcek, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const kap = document.createElement("div"); kap.className = "pon-sayfalar";
    for(let i = 1; i <= belge.numPages; i++){
      const sy = await belge.getPage(i); if(no !== ciziliyor) return;
      const v1 = sy.getViewport({ scale: 1 }), sc = gen / v1.width, v = sy.getViewport({ scale: sc * dpr });
      const c = document.createElement("canvas"); c.width = Math.round(v.width); c.height = Math.round(v.height);
      c.style.width = Math.round(v1.width * sc) + "px"; c.style.height = Math.round(v1.height * sc) + "px";
      kap.appendChild(c);
      await sy.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
      if(i === 1){ g.innerHTML = ""; g.appendChild(kap); }
    }
    if(!kap.parentNode){ g.innerHTML = ""; g.appendChild(kap); }
  };
  ov.addEventListener("click", e => {
    if(e.target.closest("[data-ponkapat]")){ ciziliyor++; ov.remove(); return; }
    if(e.target.closest("[data-ponpaylas]")){ pdfPaylas(); return; }
    const z = e.target.closest("[data-ponz]");
    if(z){ const yeni = Math.max(1, Math.min(3, olcek + Number(z.dataset.ponz) * 0.5)); if(yeni !== olcek){ olcek = yeni; ciz(); } }
  });
  try{
    await pdfjsHazir();
    belge = await window.pdfjsLib.getDocument({ data: new Uint8Array(await d.blob.arrayBuffer()) }).promise;
    await ciz();
  }catch(err){ const g = document.getElementById("pon-govde"); if(g) g.innerHTML = `<div class="pon-yuk">Önizleme açılamadı: ${esc(err.message)}</div>`; }
}
async function pdfPaylas(){
  const d = pdfDurum; if(!d || !d.blob) return;
  const f = d.dosya || new File([d.blob], d.ad, { type: "application/pdf" });
  // Paylaşım menüsü yalnız dosyayla açılır (başlık/link yok). Tarayıcıda
  // açılan PDF'ten paylaşılırsa iPhone dosyayı "Unknown.pdf" ve yanına
  // "blob:…" linkiyle gönderir; bu yüzden indirmeye yalnız paylaşım hiç
  // yoksa düşülür, hata olursa ne olduğu yazılır.
  if(navigator.share){
    try{ await navigator.share({ files: [f] }); return; }
    catch(e){
      if(e && e.name === "AbortError") return;
      pdfDurumYaz("Paylaşım menüsü açılamadı (" + ((e && (e.name + ": " + e.message)) || "bilinmeyen hata") + "). Tekrar Paylaş / Gönder'e dokunun.");
      return;
    }
  }
  const u = URL.createObjectURL(new Blob([d.blob], { type: "application/pdf" }));
  const a = document.createElement("a"); a.href = u; a.download = d.ad; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
  bildir("PDF indirildi");
}

// ----- PDF sayfa düzeni (tasarım 5: zebra satırlar) -----
// Üstte yalnız iş adı (yüklenici parantez içinde); altında 16:9 harita
// (sayfa genişliğinde, ortalı); haritanın altında solda İhale Bilgileri,
// sağda KM Bilgileri. Altta kurum · birim | Kontrol Şefi, sağda tarih · sayfa.
const PDF = { x0: 12, x1: 198, k: 12, ust: 9, alt: 13, o: 1, a: 1, olcum: false, zebra: 0, turuncu: [234, 88, 12], koyu: [17, 24, 39], gri: [100, 116, 139], cizgi: [226, 232, 240] };
const BUYUK = s => String(s || "").toLocaleUpperCase("tr-TR");
function pdfTam(doc){ PDF.x0 = PDF.k; PDF.x1 = doc.internal.pageSize.getWidth() - PDF.k; }
// Her sayfaya alt bilgi: kurum · birim | Kontrol Şefi — sağda tarih · sayfa
function pdfCerceve(doc){
  const n = doc.getNumberOfPages(), t = new Date();
  const tarihS = `${p2(t.getDate())}.${p2(t.getMonth() + 1)}.${t.getFullYear()}`;
  for(let i = 1; i <= n; i++){
    doc.setPage(i);
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    doc.setDrawColor(...PDF.cizgi); doc.setLineWidth(0.3); doc.line(PDF.k, H - 10, W - PDF.k, H - 10);
    doc.setFontSize(7.2);
    let x = PDF.k;
    const kTam = kurumTam(), kU = kurumU();
    if(kTam){ doc.setFont("DV", "bold"); doc.setTextColor(...PDF.koyu); doc.text(kTam, x, H - 6); x += doc.getTextWidth(kTam); }
    doc.setFont("DV", "normal"); doc.setTextColor(...PDF.gri); if(kU){ const t = (kTam ? " · " : "") + kU; doc.text(t, x, H - 6); x += doc.getTextWidth(t); }
    let sef; for(let q = i; q >= 1 && sef === undefined; q--) sef = (doc._sef || {})[q];
    if(sef){ doc.setTextColor(203, 213, 225); doc.text("|", x + 2, H - 6); x += 5; doc.setTextColor(...PDF.gri); doc.text("Kontrol Şefi: ", x, H - 6); x += doc.getTextWidth("Kontrol Şefi: "); doc.setFont("DV", "bold"); doc.setTextColor(55, 65, 81); doc.text(sef, x, H - 6); }
    doc.setFont("DV", "normal"); doc.setTextColor(...PDF.gri);
    doc.text(`${tarihS} · Sayfa ${i} / ${n}`, W - PDF.k, H - 6, { align: "right" });
  }
}
// Bölüm başlığı: turuncu zemin, beyaz yazı
function pdfBolumBaslik(doc, y, ad){
  const h = 6 * PDF.a;
  doc.setFillColor(...PDF.turuncu); doc.roundedRect(PDF.x0, y, PDF.x1 - PDF.x0, h, 0.8, 0.8, "F");
  doc.setFont("DV", "bold"); doc.setFontSize(8.2 * PDF.o); doc.setTextColor(255, 255, 255);
  doc.text(BUYUK(ad), PDF.x0 + 2, y + h * 0.68);
  PDF.zebra = 0;
  return y + h + 1.2 * PDF.a;
}
// Sayfaya sığmıyorsa yeni dikey sayfa (devamı tam genişlikte)
function pdfYer(doc, y, h){
  if(PDF.olcum) return y;   // ölçüm turunda sayfa bölünmez, yalnız yükseklik hesaplanır
  const H = doc.internal.pageSize.getHeight();
  if(y + h <= H - PDF.alt) return y;
  doc.addPage("a4", "portrait");
  pdfTam(doc);
  return PDF.ust;
}
// Zebra satır zemini (tek sıralar açık turuncu)
function pdfZebra(doc, y, h){
  if(PDF.zebra++ % 2 === 0){ doc.setFillColor(255, 247, 237); doc.rect(PDF.x0, y, PDF.x1 - PDF.x0, h, "F"); }
}
// İşin başlığı (her işte bir kez): kalın iş adı, yanında parantez içinde yüklenici
function pdfKutu(doc, j, y){
  const W = doc.internal.pageSize.getWidth(), gen = W - 2 * PDF.k;
  const yk = j.firma ? ` (${j.firma})` : "";
  doc.setFont("DV", "bold"); doc.setFontSize(14);
  const adS = doc.splitTextToSize(j.ad, gen);
  let yy = y + 5;
  adS.forEach((sat, n) => { doc.setFont("DV", "bold"); doc.setFontSize(14); doc.setTextColor(...PDF.koyu); doc.text(sat, PDF.k, yy); if(n < adS.length - 1) yy += 6; });
  if(yk){
    doc.setFont("DV", "bold"); doc.setFontSize(14);
    const sonG = doc.getTextWidth(adS[adS.length - 1]);
    doc.setFont("DV", "normal"); doc.setFontSize(11);
    const ykG = doc.getTextWidth(yk);
    if(PDF.k + sonG + ykG <= W - PDF.k){ doc.setTextColor(...PDF.gri); doc.text(yk, PDF.k + sonG, yy); }
    else { yy += 5; doc.setTextColor(...PDF.gri); doc.text(doc.splitTextToSize(yk.trim(), gen)[0], PDF.k, yy); }
  }
  return yy + 3.5;
}
function pdfTablo(doc, y, basliklar, satirlar){
  const sh = 6 * PDF.a, by = sh * 0.68;
  y = pdfYer(doc, y, sh * (satirlar.length + 1));
  const X = PDF.x0, gen = PDF.x1 - X;
  const ilkG = Math.min(48, gen * 0.4);
  const sw = basliklar.length ? (gen - ilkG) / basliklar.length : 0;
  doc.setFillColor(255, 237, 213); doc.rect(X, y, gen, sh, "F");
  doc.setFont("DV", "bold"); doc.setFontSize(Math.min(7.2, sw * 0.55) * PDF.o); doc.setTextColor(154, 52, 18);
  basliklar.forEach((b, i) => doc.text(b, X + ilkG + sw * (i + 1) - 1.5, y + by, { align: "right" }));
  y += sh;
  PDF.zebra = 1;
  satirlar.forEach(([e, deg, vurgu]) => {
    if(vurgu){ doc.setFillColor(254, 215, 170); doc.rect(X, y, gen, sh, "F"); PDF.zebra++; } else pdfZebra(doc, y, sh);
    doc.setFont("DV", vurgu ? "bold" : "normal"); doc.setFontSize(7.4 * PDF.o); doc.setTextColor(...(vurgu ? [154, 52, 18] : PDF.gri));
    doc.text(e, X + 1.5, y + by);
    doc.setFont("DV", "bold"); doc.setFontSize(Math.min(7.4, sw * 0.5) * PDF.o);
    if(!vurgu) doc.setTextColor(...PDF.koyu);
    deg.forEach((v, i) => doc.text(v, X + ilkG + sw * (i + 1) - 1.5, y + by, { align: "right" }));
    y += sh;
  });
  return y + 2.5 * PDF.a;
}
function pdfSatir(doc, y, e, v, vurgu){
  const sh = 6 * PDF.a, by = sh * 0.68;
  y = pdfYer(doc, y, sh);
  const X = PDF.x0;
  if(vurgu){ doc.setFillColor(254, 215, 170); doc.rect(X, y, PDF.x1 - X, sh, "F"); } else pdfZebra(doc, y, sh);
  doc.setFont("DV", vurgu ? "bold" : "normal"); doc.setFontSize(7.4 * PDF.o); doc.setTextColor(...(vurgu ? [154, 52, 18] : PDF.gri)); doc.text(e, X + 1.5, y + by);
  doc.setFont("DV", "bold"); doc.setFontSize(7.6 * PDF.o); doc.setTextColor(...(vurgu ? [154, 52, 18] : PDF.koyu)); doc.text(v, PDF.x1 - 1.5, y + by, { align: "right" });
  return y + sh;
}
// KM Bilgileri: İhale Uzunluğu ve <yıl> Öncesi tek (iş toplamı); sonrası
// (Hedef, Yapılan, Kalan) standart standart; en altta Toplam Kalan.
// Fiziksel gerçekleşme yalnız çubuklarda, burada yok.
// KM Bilgileri sütunları: bu yılın standartları + öncesinde biten olan
// standartlar (o: <yıl> Öncesi Yapılan). Eski veride (onc yok) null döner.
function kmKolonlar(j){
  if(!Array.isArray(j.onc)) return null;
  const k = j.cats.map(c => ({ ad: c.ad, h: c.h, b: c.b, o: 0 }));
  j.onc.forEach(x => { const c = k.find(y => y.ad === x.ad); if(c) c.o = x.o; else k.push({ ad: x.ad, h: 0, b: 0, o: x.o }); });

}
function kmOzet(j){
  const uz = j.uz || [];
  const top = k => uz.reduce((t, r) => t + (Number(r[k]) || 0), 0);
  const u = uz.length && uz.some(r => r.u !== null && r.u !== undefined) ? top("u") : null;
  const o = uz.length ? top("o") : null;

  const kol = oz.u !== null ? kmKolonlar(j) : null;

function pdfIhaleListe(j, tl){

// 16:9 harita (w genişlik, h = w·9/16). Programda atanmış harita resmi
// varsa: resmin içine sığan en büyük 16:9 alan, kırmızı yol hattı ortada
// kalacak şekilde kesilir. Yoksa KMZ: uydu altlığı + hat kendi renkleriyle,
// hattın tamamı görünecek şekilde. Üzerinde yazı yok; ince siyah çerçeve.
function kirmiziMerkez(im){
  // küçültülmüş kopyada saf kırmızı pikseller (turuncu sayılmaz)
  const s = Math.min(1, 700 / Math.max(im.width, im.height));
  const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s));

  let d; try{ d = g.getImageData(0, 0, c.width, c.height).data; }catch(e){ return null; }

  for(let y = 0; y < c.height; y++) for(let x = 0; x < c.width; x++){
    const p = (y * c.width + x) * 4, r = d[p], gg = d[p + 1], b = d[p + 2];

  }

}
async function pdfHarita(doc, j, x, y, w){

    const im = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = resim; });

      const W = im.width, H = im.height, m = kirmiziMerkez(im) || [W / 2, H / 2];

}
// İlk (boş) sayfa kullanılır; sonrakiler eklenir
function yeniSayfa(doc, yatay){

    doc._bos = false;
    if(yatay){ doc.addPage("a4", "landscape"); doc.deletePage(1); }
    return;

  doc.addPage("a4", yatay ? "landscape" : "portrait");
}
async function pdfIs(doc, j, bol){
  const dikey = bol.bilgi || (bol.par && parVar(j));
  let kutuYazildi = false;
  if(dikey){
    yeniSayfa(doc, false);
    pdfTam(doc);
    (doc._sef = doc._sef || {})[doc.getNumberOfPages()] = j.sef || "";

    kutuYazildi = true;
    const W = doc.internal.pageSize.getWidth(), gen = W - 2 * PDF.k, Hs = doc.internal.pageSize.getHeight() - PDF.alt;
    const par = bol.par && parVar(j), bil = bol.bilgi;
    const harV = par && (!!j.hr || !!(j.hat && j.hat.cizgi && j.hat.cizgi.some(c => c.p && c.p.length > 1)));
    // Sütunlar: solda İhale Bilgileri, sağda KM Bilgileri (biri yoksa tam genişlik)
    const ara = 7, solG = par && bil ? (gen - ara) * 0.535 : gen;
    const ciz = (d, yy) => {
      let yK = yy, yI = yy;
      if(bil){ PDF.x0 = par ? PDF.k + solG + ara : PDF.k; PDF.x1 = W - PDF.k; yK = pdfBilgi(d, j, yy); }

    const kodlar = (j.iti || []).filter(k => D.iti.projeler[k]);
    for(const kod of kodlar){
      const resimler = await itiResimleri(kod);
      for(const r of resimler){
        yeniSayfa(doc, true);
        const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
        let yy = PDF.ust;
        (doc._sef = doc._sef || {})[doc.getNumberOfPages()] = j.sef || "";

        doc.setFont("DV", "bold"); doc.setFontSize(10); doc.setTextColor(...PDF.koyu);

// ===== 3B görünüm (telefon ve masaüstü ortak) =====
// Leaflet haritasında o an çizili olan çizgi ve noktalar (işin KMZ'si,
// genel KMZ'ler, tüm işler, drone rotaları) MapLibre ile uydu görüntüsü +
// gerçek arazi üstünde eğik görünümde çizilir. Yüksekliği olan drone
// rotaları (TXT'deki kalkışa göre yükseklik) havada, yere inen yarı saydam

  async function ac(container, lm, secenek){

      guncelle(){ clearTimeout(guncelZaman); guncelZaman = setTimeout(() => yuklendi.then(() => { son = topla(lm); ["cizgi", "nokta", "serit", "perde"].forEach(k => map.getSource(k) && map.getSource(k).setData(son[k])); htmlKur(); }), 120); },
      git(ll, ani){ gitIc(ll, ani); },

      vurgu(id){

          const s = (a, b) => ["case", ["==", ["get", "ucusId"], secUcus], a, b];
          map.setPaintProperty("serit", "fill-extrusion-opacity", 1);
          map.setPaintProperty("serit", "fill-extrusion-color", s("#c2410c", ["get", "renk"]));
          map.setPaintProperty("perde", "fill-extrusion-opacity", .1);
          map.setPaintProperty("cizgi", "line-opacity", ["case", ["==", ["get", "yan"], 1], s(1, .2), ["get", "op"]]);

        });
      },
      konum(lat, lng){ if(!konumIsaret){ const d = document.createElement("div"); d.style.cssText = "width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 3px rgba(37,99,235,.35)"; konumIsaret = new ml.Marker({ element: d }); } konumIsaret.setLngLat([lng, lat]).addTo(map); map.flyTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 15), duration: 1800 }); },

      yokEt(){ iptal(); clearInterval(yanZaman); clearTimeout(guncelZaman); try{ map.remove(); }catch(e){} }
    };
  }
  return { ac, hazir };
})();

// ---------- arama: eşleşen yazıyı vurgulama ----------
function vurgula(metin, q){
  const t = String(metin || ""), k = fold(q).trim();
  if(!k) return esc(t);
  const f = fold(t);
  if(f.length !== t.length) return esc(t);
  let out = "", i = 0, n;
  while((n = f.indexOf(k, i)) >= 0){ out += esc(t.slice(i, n)) + "<mark>" + esc(t.slice(n, n + k.length)) + "</mark>"; i = n + k.length; }
  return out + esc(t.slice(i));
}

// Hatta yapış: noktalar işin en uzun hattına izdüşürülür, mesafe hat boyunca
function hatBoyu(){
  if(hatIs._boy) return hatIs._boy;
  const c = anaCizgiler(hatIs).slice().sort((a, b) => b.p.length - a.p.length)[0];
  const kum = [0]; for(let i = 1; i < c.p.length; i++) kum.push(kum[i - 1] + haversine(c.p[i - 1], c.p[i]));
  return (hatIs._boy = { p: c.p, kum });
}
function hattaYer(lat, lon){
  const h = hatBoyu(), k = Math.cos(lat * Math.PI / 180), M = 111320;
  const xy = p => [(p[1] - lon) * k * M, (p[0] - lat) * M];
  let en = null;
  for(let i = 1; i < h.p.length; i++){
    const A = xy(h.p[i - 1]), B = xy(h.p[i]), dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
    let t = L2 ? -(A[0] * dx + A[1] * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(A[0] + t * dx, A[1] + t * dy);
    if(!en || d < en.d) en = { d, i, t, s: h.kum[i - 1] + t * (h.kum[i] - h.kum[i - 1]), p: [h.p[i - 1][0] + t * (h.p[i][0] - h.p[i - 1][0]), h.p[i - 1][1] + t * (h.p[i][1] - h.p[i - 1][1])] };
  }
  return en;
}
function hatParcasi(a, b){
  const h = hatBoyu(), [x, y] = a.s <= b.s ? [a, b] : [b, a];
  const out = [x.p];
  for(let i = x.i; i < y.i; i++) out.push(h.p[i]);
  out.push(y.p);
  return out;
}
function olcCiz(){
  if(!olc) return;
  olc.g.clearLayers();
  const k = document.getElementById("olckart");
  let toplam = 0, parca = [], kmA = null, kmB = null;
  if(olc.tur === "kus"){
    if(olc.nok.length > 1) L.polyline(olc.nok, { color: "#facc15", weight: 3, dashArray: "7 6" }).addTo(olc.g);
    for(let i = 1; i < olc.nok.length; i++){
      const d = haversine(olc.nok[i - 1], olc.nok[i]); toplam += d; parca.push(d);
      const ort = [(olc.nok[i - 1][0] + olc.nok[i][0]) / 2, (olc.nok[i - 1][1] + olc.nok[i][1]) / 2];
      L.marker(ort, { icon: L.divIcon({ className: "", html: `<span class="olcet">${mesafe(d)}</span>`, iconSize: null }), interactive: false }).addTo(olc.g);
    }

  }else{
    const yer = olc.nok.map(p => hattaYer(p[0], p[1])).filter(Boolean);
    for(let i = 1; i < yer.length; i++){
      const d = Math.abs(yer[i].s - yer[i - 1].s); toplam += d; parca.push(d);
      L.polyline(hatParcasi(yer[i - 1], yer[i]), { color: "#facc15", weight: 6, opacity: .95 }).addTo(olc.g);
    }
    yer.forEach(y => L.circleMarker(y.p, { radius: 7, color: "#422006", weight: 2, fillColor: "#facc15", fillOpacity: 1, interactive: false }).addTo(olc.g));
    if(yer.length > 1){ const r1 = kmBul(hatIs, yer[0].p[0], yer[0].p[1]), r2 = kmBul(hatIs, yer[yer.length - 1].p[0], yer[yer.length - 1].p[1]); kmA = r1 && r1.km; kmB = r2 && r2.km; }
  }
  const ust = document.getElementById("olcust");
  if(ust) ust.innerHTML = olc.tur === "kus" ? "<b>Mesafe ölçme açık</b><small>Haritaya dokunarak nokta ekleyin</small>" : "<b>Hatta yapış açık</b><small>Noktalar işin hattına oturur</small>";
  if(k) k.innerHTML = `<div class="t"><b>${olc.nok.length > 1 ? mesafe(toplam) : "–"}</b><span>${olc.nok.length} nokta · ${olc.tur === "kus" ? "kuş uçuşu" : "yol boyunca"}</span></div>
<div class="s">${olc.tur === "hat" && kmA !== null && kmB !== null && kmA !== undefined && kmB !== undefined ? `Yaklaşık ${kmYaz(Math.min(kmA, kmB))} → ${kmYaz(Math.max(kmA, kmB))} arası` : parca.length > 1 ? "Parçalar: " + parca.map(mesafe).join(" · ") : olc.nok.length ? "Bir nokta daha ekleyin" : "İlk noktaya dokunun"}</div>
<div class="seg2"><button data-olctur="kus"${olc.tur === "kus" ? ' class="on"' : ""}>Kuş uçuşu</button><button data-olctur="hat"${olc.tur === "hat" ? ' class="on"' : ""}>Hatta yapış</button></div>
<div class="bt"><button data-olcgeri>↶ Geri al</button><button data-olcsil>Temizle</button><button class="p" data-olcbitir>Bitir</button></div>`;
  // son nokta kartın arkasında kalmasın
  if(olc.nok.length && hatHarita){ const son = olc.nok[olc.nok.length - 1], pt = hatHarita.latLngToContainerPoint(son), H = document.getElementById("hatmap").clientHeight; if(pt.y > H - 230) hatHarita.panBy([0, pt.y - (H - 260)]); }

function baslikGuzel(h){
  const s = String(h || ""), harf = s.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g, "");
  if(!harf || harf !== harf.toLocaleUpperCase("tr-TR")) return s;
  return s.split(/(\([^)]*\))/).map(p => p.startsWith("(") ? p : p.toLocaleLowerCase("tr-TR").replace(/(^|[\s\-/.])([a-zçğıöşü])/g, (m, a, b) => a + b.toLocaleUpperCase("tr-TR"))).join("");
}
function trSayi(v){
  const s = String(v ?? "").trim(), m = s.match(/^(-?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?(%?)$/);
  if(!m) return s;
  const [, e, t, o, y] = m;
  if(!y && !o && !t.includes(",")) return s;
  const r = e + t.replace(/,/g, ".") + (o ? "," + o : "");
  return y ? "%" + r : r;
}

    if(j.hat && !(j.hat.cizgi.length || j.hat.nok.length)) j.hat = null;

  return v;
}

// ===================== Giriş (kullanıcı adı + şifre) =====================
// Program "Telefon Verisi"ni şifreli hazırlar: veri rastgele bir anahtarla
// (AES-GCM) kilitli, o anahtar her kullanıcı için şifresinden türetilen
// anahtarla (PBKDF2, 120000 tur) ayrıca kilitli (bkz. program →
// modules/mobil-kullanici.js). Doğru kullanıcı adı + şifre olmadan açılmaz.
// "Beni hatırla": bu telefonda süresiz; program o kişinin şifresini
// değiştirirse (sürüm artar) yeni dosyada tekrar sorulur. Kullanıcı kendi
// şifresini anahtar ikonundan değiştirebilir (yalnız bu telefonda geçerli).
const GIRIS = (() => {
  const ITER = 120000, enc = new TextEncoder(), dec = new TextDecoder();
  const norm = s => String(s || "").trim().toLocaleLowerCase("tr-TR").replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c").replace(/\s+/g, "");
  const b64 = buf => { const a = new Uint8Array(buf); let s = ""; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  const yazLS = (k, v, depo) => { try{ v === null ? (depo || localStorage).removeItem(k) : (depo || localStorage).setItem(k, JSON.stringify(v)); }catch(e){} };
  async function turet(tuz, sifre){
    const temel = await crypto.subtle.importKey("raw", enc.encode(norm(sifre)), "PBKDF2", false, ["deriveBits"]);

  const yereller = () => okuLS("istakip-yerel-sifre") || {};

  async function anahtarAc(kul, kadi, kekRaw){
    const e = (kul || []).find(x => x.k === kadi); if(!e) return null;

  async function oturumlaAc(kul){
    const o = oturum(); if(!o) return null;
    const e = (kul || []).find(x => x.k === o.k);
    if(!e || Number(e.v) !== Number(o.v)) return null;     // silinmiş ya da şifresi programda değişmiş

function havaEfekt(kod){
  const c = document.getElementById("dhhava"); if(!c) return;
  const [, tur] = HAVA_KOD(kod), sa = new Date().getHours(), gece = sa < 6 || sa >= 20;
  const mod = tur === "yagmur" || tur === "firtina" ? "yagmur" : tur === "kar" ? "kar" : tur === "gunes" ? (gece ? "acik" : "gunes") : tur === "parcali" ? (gece ? "acik" : "bulut") : "bulut";
  const g = c.getContext("2d"), d = Math.min(2, window.devicePixelRatio || 1);
  const W = c.width = c.clientWidth * d, H = c.height = c.clientHeight * d;
  const n = { yagmur: 25, kar: 18, bulut: 3, gunes: 0, acik: 24 }[mod];
  const P = Array.from({ length: n }, (_, i) => ({ x: Math.random() * W, y: Math.random() * H, v: .7 + Math.random() * .5, r: Math.random(), f: Math.random() * 6, i }));
  const t0 = performance.now(); let son = 0;
  const kare = t => {
    if(!document.body.contains(c)) return;
    const dt = Math.min(.05, (t - (son || t)) / 1000); son = t;
    const gec = (t - t0) / 1000, s = (gec < 4 ? 1 : Math.max(.28, 1 - (gec - 4) / 2.5)) * Math.min(1, gec / .8);
    g.clearRect(0, 0, W, H);
    if(mod === "yagmur"){ g.strokeStyle = `rgba(190,210,235,${.3 * s})`; g.lineWidth = d * .8; g.lineCap = "round"; g.beginPath();
      P.forEach(p => { p.y += 260 * p.v * dt * d; p.x -= 22 * dt * d; if(p.y > H + 10){ p.y = -14 * d; p.x = Math.random() * W * 1.1; } g.moveTo(p.x, p.y); g.lineTo(p.x + 1.5 * d, p.y - 11 * d); }); g.stroke(); }
    else if(mod === "kar"){ P.forEach(p => { p.y += 16 * p.v * dt * d; p.x += Math.sin(t / 1600 + p.f) * .18 * d; if(p.y > H + 6){ p.y = -6 * d; p.x = Math.random() * W; } g.fillStyle = `rgba(255,255,255,${(.35 + p.r * .3) * s})`; g.beginPath(); g.arc(p.x, p.y, (1.2 + p.r * 1.6) * d, 0, 7); g.fill(); }); }
    else if(mod === "bulut"){ P.forEach(p => { p.x += (5 + p.i * 3) * dt * d; const w = (150 + p.i * 50) * d; if(p.x > W + w) p.x = -w; const y = (30 + p.i * 46) * d;
      const rg = g.createRadialGradient(p.x, y, 0, p.x, y, w * .6); rg.addColorStop(0, `rgba(226,232,240,${.13 * s + .03})`); rg.addColorStop(1, "rgba(226,232,240,0)"); g.fillStyle = rg; g.beginPath(); g.ellipse(p.x, y, w * .6, w * .22, 0, 0, 7); g.fill(); }); }
    else if(mod === "gunes"){ const x = W * .92, y = H * .05, nf = .85 + .15 * Math.sin(t / 1800);
      const rg = g.createRadialGradient(x, y, 0, x, y, W * .55 * nf); rg.addColorStop(0, `rgba(255,205,140,${.32 * s + .06})`); rg.addColorStop(.5, `rgba(255,190,120,${.1 * s + .02})`); rg.addColorStop(1, "rgba(255,190,120,0)"); g.fillStyle = rg; g.fillRect(0, 0, W, H); }
    else P.forEach(p => { const a = (.25 + .35 * (.5 + .5 * Math.sin(t / 1400 + p.f))) * (p.r * .6 + .4); g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(p.x, p.y * .8, (.6 + p.r * .8) * d, 0, 7); g.fill(); });
    requestAnimationFrame(kare);
  };
  requestAnimationFrame(kare);
}

// ---------- v37: Boy kesit bütün hat boyunca ----------
// İşin bütün ana çizgi parçaları uç uca eklenir (en yakın uçtan; gerekirse ters
// çevrilerek). Aynı yerden geçen ikinci çizgi (ör. bölünmüş yolun diğer şeridi) atlanır.
function bkZincir9(j){
  const uz = p => { let t = 0; for(let i = 1; i < p.length; i++) t += mesafe6(p[i - 1], p[i]); return t; };
  let kal = anaCizgiler(j).filter(c => c && c.p && c.p.length >= 2).map(c => c.p.map(q => [q[0], q[1]]));
  if(!kal.length) return null;
  kal.sort((a, b) => uz(b) - uz(a));
  let z = kal.shift();
  const yakin = (p, liste) => { let m = 1e18; for(let i = 0; i < liste.length; i += Math.max(1, Math.floor(liste.length / 400))) m = Math.min(m, mesafe6(p, liste[i])); return m; };
  // üst üste binen kopya çizgileri ayıkla
  kal = kal.filter(q => { const ornek = [0, .25, .5, .75, 1].map(f => q[Math.min(q.length - 1, Math.round(f * (q.length - 1)))]); return ornek.filter(p => yakin(p, z) < 60).length < 4; });
  while(kal.length){
    let en = null;
    kal.forEach((q, i) => {
      const s = z[z.length - 1], b = z[0];
      [[mesafe6(s, q[0]), i, "son", false], [mesafe6(s, q[q.length - 1]), i, "son", true], [mesafe6(b, q[q.length - 1]), i, "bas", false], [mesafe6(b, q[0]), i, "bas", true]]
        .forEach(x => { if(!en || x[0] < en[0]) en = x; });
    });
    if(!en || en[0] > 5000) break;
    let q = kal.splice(en[1], 1)[0]; if(en[3]) q = q.slice().reverse();
    z = en[2] === "son" ? z.concat(q) : q.concat(z);
  }
  return { p: z };
}
