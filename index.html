function haftaPenceresi(){
  // bugünün haftası (Pazartesi 00:00 – Pazar 23:59); Pazar gece 12'de liste boşalır
  const n = new Date();
  const pt = new Date(n); pt.setDate(n.getDate() - ((n.getDay() + 6) % 7)); pt.setHours(0, 0, 0, 0);
  const pz = new Date(pt); pz.setDate(pt.getDate() + 6); pz.setHours(23, 59, 59, 999);
  return { a: pt.getTime(), b: pz.getTime(), pt, pz };
}
const kmSayi = v => { const s = String(v ?? "").trim(); const m = s.match(/^(-?\d+)\s*\+\s*(\d+)$/); if(m) return +m[1] + +m[2] / 1000; const x = parseFloat(s.replace(",", ".")); return Number.isFinite(x) ? x : null; };
function haftaGirisleri(){
  const w = haftaPenceresi(), out = [];
  ISLER.forEach(j => { if(j.ekleme) return; (j.kmler || []).forEach(k => {
    if(!k.g || k.g < w.a || k.g > w.b || k.gz === 0) return;
    const s = kmSayi(k.a), e = kmSayi(k.e); if(s === null || e === null) return;
    out.push({ j, k, km: Math.abs(e - s) / (k.y ? 2 : 1) });
  }); });
  return out.sort((x, y) => y.k.g - x.k.g);
}

function mapUygula(){
  const inn = document.getElementById("mapin"), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");

  inn.style.width = W + "px";
  const iw = W * mz.s, ih = img.offsetHeight * mz.s;
  mz.x = Math.min(0, Math.max(W - iw, mz.x));
  mz.y = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, mz.y));
  inn.style.transform = `translate(${mz.x}px,${mz.y}px) scale(${mz.s})`;
  const bw = (2 / mz.s) + "px";
  inn.querySelectorAll(".kutu").forEach(k => { k.style.borderWidth = bw; });
}
function mapZoom(f, cx, cy){
  const w = document.getElementById("mapwrap"); if(!w) return;
  const ns = Math.min(10, Math.max(1, mz.s * f));
  cx = cx ?? w.clientWidth / 2; cy = cy ?? w.clientHeight / 2;
  mz.x = cx - (cx - mz.x) * ns / mz.s; mz.y = cy - (cy - mz.y) * ns / mz.s; mz.s = ns;
  mapUygula();
}
function resimHazir(f){

}
function mapKur(){

  w.addEventListener("touchstart", e => {
    if(e.target.closest(".sheet, .zoom, .hust")) return;
    if(e.touches.length === 2){ const [a, b] = e.touches; d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); s0 = mz.s; m0 = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }; t0 = null; }
    else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y };
      const now = Date.now(); if(false && now - last < 300){ const r = w.getBoundingClientRect(); mapZoom(2, e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); } last = now; }
  }, { passive: true });

// jsPDF ve yazı tipleri ilk kullanımda yüklenir (çevrimdışı önbellekte durur)
let pdfKutuphane = null;
function pdfHazirla(){
  if(pdfKutuphane) return pdfKutuphane;
  pdfKutuphane = (async () => {
    if(!window.jspdf) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "jspdf.min.js"; s.onload = ok; s.onerror = () => no(new Error("PDF bileşeni yüklenemedi")); document.head.appendChild(s); });
    const b64 = async u => { const r = await fetch(u); if(!r.ok) throw new Error("Yazı tipi yüklenemedi"); const a = new Uint8Array(await r.arrayBuffer()); let s = ""; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
    return { normal: await b64("DejaVuSans-tr.ttf"), kalin: await b64("DejaVuSans-Bold-tr.ttf") };
  })();
  pdfKutuphane.catch(() => { pdfKutuphane = null; });
  return pdfKutuphane;
}

// Yol Takip çizimini resme çevir: stiller öğelere işlenir, SVG → canvas → JPEG
// PDF itinerer sayfası: km özeti tek satır, sayfa genişliğine sığacak en büyük boyutta (gerekirse etiketler kısalır)
function pdfItiBas9(doc, bas, x, y, gen){
  const ara = 3;
  const olc = (L, fs) => { doc.setFontSize(fs); return L.reduce((t, [yz]) => t + doc.getTextWidth(yz), 0) + ara * (L.length - 1); };
  let L = bas.map(b => [String(b[0]).trim(), b[1]]), fs = 10;
  doc.setFont("DV", "bold");
  while(olc(L, fs) > gen && fs > 6) fs -= 0.25;
  if(olc(L, fs) > gen){
    const K = [[/İhale Uzunluğu/, "İhale Uz."], [/Toplam Kalan/, "Top. Kalan"], [/'da Yapılan/, " Yapılan"], [/ Öncesi/, " Önc."]];
    L = L.map(([yz, r]) => { K.forEach(([a, b]) => { yz = yz.replace(a, b); }); return [yz, r]; });
    while(olc(L, fs) > gen && fs > 4.5) fs -= 0.25;
  }
  doc.setFontSize(fs);
  const rgb = h => { const m = String(h).match(/^#?([0-9a-f]{6})$/i); if(!m) return [26, 26, 26]; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const yb = y + fs * 0.3528 + 0.5; let xx = x;
  L.forEach(([yz, r]) => { doc.setTextColor(...rgb(r)); doc.text(yz, xx, yb); xx += doc.getTextWidth(yz) + ara; });
  doc.setTextColor(...PDF.koyu);
  return yb + 2.5;
}
async function itiResimleri(kod){
  const pr = D.iti.projeler[kod]; if(!pr) return [];
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-10000px;top:0;width:4000px;background:#fff";
  document.body.appendChild(host);
  host.attachShadow({ mode: "open" }).innerHTML = `<style>${itiCss()}</style><div class="kap">${pr.html}</div>`;
  const ozellik = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity", "stroke-dasharray", "stroke-linecap", "stroke-linejoin", "opacity", "font-size", "font-family", "font-weight", "font-style", "text-anchor", "dominant-baseline", "visibility", "display", "letter-spacing"];
  const svgs = [...host.shadowRoot.querySelectorAll("svg")].filter(x => !x.parentElement.closest("svg") && x.viewBox && x.viewBox.baseVal && x.viewBox.baseVal.width);
  const out = [];
  for(const s of svgs){
    let vb = s.viewBox.baseVal;
    s.style.width = vb.width + "px"; s.style.height = vb.height + "px";
    if(itiDuzelt9(s.parentNode, itiIs9(kod))){ vb = s.viewBox.baseVal; s.style.width = vb.width + "px"; s.style.height = vb.height + "px"; }
    const kopya = s.cloneNode(true);
    const kaynak = [s, ...s.querySelectorAll("*")], hedef = [kopya, ...kopya.querySelectorAll("*")];
    kaynak.forEach((el, i) => { const cs = getComputedStyle(el); hedef[i].setAttribute("style", ozellik.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";")); });
    kopya.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    // v115: üstteki km özeti PDF'e yazı olarak yazılır (her cihazda tek satır, sayfa genişliğine sığar); resimden çıkarılır
    let bas = null;
    const bg = s.querySelector("g[data-bas9]"), bk = kopya.querySelector("g[data-bas9]");
    if(bg && bk){
      bas = [...bg.querySelectorAll("tspan")].map(x => [x.getAttribute("data-tam9") || x.textContent, x.getAttribute("fill") || "#1a1a1a"]).filter(x => x[0].trim());
      bk.remove();
      let ic = null; bg.style.display = "none"; try{ ic = s.getBBox(); }catch(_){} finally{ bg.style.display = ""; }
      if(ic && ic.width > 0){ const y0 = Math.max(vb.y, ic.y - 6); if(y0 > vb.y + 1){ const yeni = { x: vb.x, y: y0, width: vb.width, height: vb.y + vb.height - y0 }; kopya.setAttribute("viewBox", `${yeni.x} ${yeni.y} ${yeni.width} ${yeni.height}`); vb = yeni; } }
    }
    kopya.setAttribute("width", vb.width); kopya.setAttribute("height", vb.height);
    const metin = new XMLSerializer().serializeToString(kopya);
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error("İtinerer çizimi resme çevrilemedi")); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(metin); });
    const k = Math.min(3, 3600 / vb.width, 2400 / vb.height);
    const c = document.createElement("canvas"); c.width = Math.round(vb.width * k); c.height = Math.round(vb.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    out.push({ veri: c.toDataURL("image/jpeg", 0.9), w: c.width, h: c.height, bas });
  }
  host.remove();
  return out;
}

const dosyaGuvenli = s => String(s).replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 120);
async function pdfYap(){
  const d = pdfDurum, isler = pdfSecili();
  const bol = { bilgi: d.bol.bilgi && isler.some(kmVar9), par: d.bol.par && isler.some(parVar), iti: d.bol.iti && isler.some(itiVar), devam: !!d.bol.devam, biten: !!d.bol.biten };
  if(!isler.length){ pdfDurumYaz("En az bir iş seçin."); return; }
  if(!bol.bilgi && !bol.par && !bol.iti && !(bol.devam && isler.some(x => String(x.devam || "").trim())) && !(bol.biten && isler.some(x => String(x.biten || "").trim()))){ pdfDurumYaz("En az bir bölüm seçin."); return; }
  const btn = document.querySelector("[data-pdfyap]"); if(btn){ btn.disabled = true; btn.textContent = "Hazırlanıyor…"; }
  try{
    await agirHazir();
    pdfDurumYaz("PDF bileşeni yükleniyor…");
    const font = await pdfHazirla();
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
    doc.addFileToVFS("dv.ttf", font.normal); doc.addFont("dv.ttf", "DV", "normal");
    doc.addFileToVFS("dvb.ttf", font.kalin); doc.addFont("dvb.ttf", "DV", "bold");
    doc.setFont("DV", "normal");
    doc._bos = true;
    for(let n = 0; n < isler.length; n++){
      pdfDurumYaz(`Hazırlanıyor… ${n + 1} / ${isler.length}`);
      await pdfIs(doc, isler[n], bol);
    }
    pdfCerceve(doc);
    const t = new Date(), tarihS = `${p2(t.getDate())}.${p2(t.getMonth() + 1)}.${t.getFullYear()}`;
    let ad = isler.length === 1 ? isler[0].ad : `${isler[0].ad} ve ${isler.length - 1} iş daha`;
    d.ad = dosyaGuvenli(`${ad} (${tarihS})`) + ".pdf";
    // Paylaşılacak dosya ayrı baytlardan, önceden hazırlanır: önizleme için
    // açılan blob: adresine bağlı olmasın (iPhone aksi hâlde WhatsApp'a
    // dosyanın yanında "blob:https://…" linkini de gönderiyor).
    const bytes = doc.output("arraybuffer");
    d.blob = new Blob([bytes.slice(0)], { type: "application/pdf" });
    d.dosya = new File([bytes.slice(0)], d.ad, { type: "application/pdf" });

  }catch(err){
    if(btn){ btn.disabled = false; btn.innerHTML = IK("pdf") + "PDF Oluştur"; }

  }
}
// Uygulama içi PDF önizleme (pdf.js): sayfalar uygulamanın içinde resim

let pdfjsSoz = null;
function pdfjsHazir(){

  if(!pdfjsSoz){
    pdfjsSoz = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "pdf.min.js"; sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js"; ok(); }; sc.onerror = () => no(new Error("Önizleme bileşeni yüklenemedi")); document.head.appendChild(sc); });
    pdfjsSoz.catch(() => { pdfjsSoz = null; });

}
async function pdfOnizle(){
  const d = pdfDurum; if(!d || !d.blob) return;
  const ov = document.createElement("div"); ov.className = "pon"; ov.id = "pon";
  ov.innerHTML = `<div class="pon-ust"><button data-ponkapat>${IK("x")}Kapat</button><b>${esc(d.ad.replace(/\.pdf$/, ""))}</b><span class="pon-z"><button data-ponz="-1" aria-label="Uzaklaştır">−</button><button data-ponz="1" aria-label="Yakınlaştır">+</button></span></div>
<div class="pon-govde" id="pon-govde"><div class="pon-yuk">Önizleme hazırlanıyor…</div></div>
<div class="pon-alt"><button class="go" data-ponpaylas>${IK("paylas")}Paylaş / Gönder</button></div>`;
  document.body.appendChild(ov);
  let olcek = 1, belge = null, ciziliyor = 0;
  const gv = ov.querySelector("#pon-govde");
  gv._olcek = 1;
  gv._yakinlas = yeni => { olcek = yeni; gv._olcek = yeni; ciz(); };
  const ciz = async () => {
    const no = ++ciziliyor, g = document.getElementById("pon-govde"); if(!g || !belge) return;
    const gen = (g.clientWidth - 16) * olcek, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const kap = document.createElement("div"); kap.className = "pon-sayfalar";
    for(let i = 1; i <= belge.numPages; i++){
      const sy = await belge.getPage(i); if(no !== ciziliyor) return;
      const v1 = sy.getViewport({ scale: 1 }), sc = gen / v1.width, v = sy.getViewport({ scale: sc * dpr });
      const c = document.createElement("canvas"); c.width = Math.round(v.width); c.height = Math.round(v.height);
      c.style.width = Math.round(v1.width * sc) + "px"; c.style.height = Math.round(v1.height * sc) + "px";
      kap.appendChild(c);
      await sy.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
      if(i === 1){ g.innerHTML = ""; g.appendChild(kap); if(g._hedef){ g.scrollLeft = g._hedef.x; g.scrollTop = g._hedef.y; } }
    }
    if(!kap.parentNode){ g.innerHTML = ""; g.appendChild(kap); }
    if(g._hedef){ g.scrollLeft = g._hedef.x; g.scrollTop = g._hedef.y; g._hedef = null; }
  };
  ov.addEventListener("click", e => {
    if(e.target.closest("[data-ponkapat]")){ ciziliyor++; ov.remove(); return; }
    if(e.target.closest("[data-ponpaylas]")){ pdfPaylas(); return; }
    const z = e.target.closest("[data-ponz]");
    if(z){ const yeni = Math.max(1, Math.min(4, olcek + Number(z.dataset.ponz) * 0.5)); if(yeni !== olcek){ const r = gv.getBoundingClientRect(), cx = r.width / 2, cy = r.height / 2; gv._hedef = { x: (gv.scrollLeft + cx) / olcek * yeni - cx, y: (gv.scrollTop + cy) / olcek * yeni - cy }; olcek = yeni; gv._olcek = yeni; ciz(); } }
  });
  try{
    await pdfjsHazir();
    belge = await window.pdfjsLib.getDocument({ data: new Uint8Array(await d.blob.arrayBuffer()) }).promise;
    await ciz();
  }catch(err){ const g = document.getElementById("pon-govde"); if(g) g.innerHTML = `<div class="pon-yuk">Önizleme açılamadı: ${esc(err.message)}</div>`; }
}
async function pdfPaylas(){
  const d = pdfDurum; if(!d || !d.blob) return;
  const f = d.dosya || new File([d.blob], d.ad, { type: "application/pdf" });
  // Paylaşım menüsü yalnız dosyayla açılır (başlık/link yok). Tarayıcıda
  // açılan PDF'ten paylaşılırsa iPhone dosyayı "Unknown.pdf" ve yanına
  // "blob:…" linkiyle gönderir; bu yüzden indirmeye yalnız paylaşım hiç
  // yoksa düşülür, hata olursa ne olduğu yazılır.
  if(navigator.share){
    try{ await navigator.share({ files: [f] }); return; }
    catch(e){
      if(e && e.name === "AbortError") return;
      pdfDurumYaz("Paylaşım menüsü açılamadı (" + ((e && (e.name + ": " + e.message)) || "bilinmeyen hata") + "). Tekrar Paylaş / Gönder'e dokunun.");
      return;
    }
  }
  const u = URL.createObjectURL(new Blob([d.blob], { type: "application/pdf" }));
  const a = document.createElement("a"); a.href = u; a.download = d.ad; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);

// ---------- arama: eşleşen yazıyı vurgulama ----------
function vurgula(metin, q){
  const t = String(metin || ""), k = fold(q).trim();
  if(!k) return esc(t);
  const f = fold(t);
  if(f.length !== t.length) return esc(t);
  let out = "", i = 0, n;
  while((n = f.indexOf(k, i)) >= 0){ out += esc(t.slice(i, n)) + "<mark>" + esc(t.slice(n, n + k.length)) + "</mark>"; i = n + k.length; }
  return out + esc(t.slice(i));
}

// Hatta yapış: noktalar işin en uzun hattına izdüşürülür, mesafe hat boyunca
function hatBoyu(){
  if(hatIs._boy) return hatIs._boy;
  const c = anaCizgiler(hatIs).slice().sort((a, b) => b.p.length - a.p.length)[0];
  const kum = [0]; for(let i = 1; i < c.p.length; i++) kum.push(kum[i - 1] + haversine(c.p[i - 1], c.p[i]));
  return (hatIs._boy = { p: c.p, kum });
}
function hattaYer(lat, lon){
  const h = hatBoyu(), k = Math.cos(lat * Math.PI / 180), M = 111320;
  const xy = p => [(p[1] - lon) * k * M, (p[0] - lat) * M];
  let en = null;
  for(let i = 1; i < h.p.length; i++){
    const A = xy(h.p[i - 1]), B = xy(h.p[i]), dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
    let t = L2 ? -(A[0] * dx + A[1] * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(A[0] + t * dx, A[1] + t * dy);
    if(!en || d < en.d) en = { d, i, t, s: h.kum[i - 1] + t * (h.kum[i] - h.kum[i - 1]), p: [h.p[i - 1][0] + t * (h.p[i][0] - h.p[i - 1][0]), h.p[i - 1][1] + t * (h.p[i][1] - h.p[i - 1][1])] };
  }
  return en;
}
function hatParcasi(a, b){
  const h = hatBoyu(), [x, y] = a.s <= b.s ? [a, b] : [b, a];
  const out = [x.p];
  for(let i = x.i; i < y.i; i++) out.push(h.p[i]);
  out.push(y.p);
  return out;
}
function olcCiz(){
  if(!olc) return;

    if(olc.nok.length > 1) L.polyline(olc.nok, { color: "#facc15", weight: 3, dashArray: "7 6" }).addTo(olc.g);
    for(let i = 1; i < olc.nok.length; i++){
      const d = haversine(olc.nok[i - 1], olc.nok[i]); toplam += d; parca.push(d);
      const ort = [(olc.nok[i - 1][0] + olc.nok[i][0]) / 2, (olc.nok[i - 1][1] + olc.nok[i][1]) / 2];

// Veri yalnızca bu telefonda (IndexedDB) saklanır; hiçbir yere gönderilmez.
const DB_AD = "istakip-mobil", DEPO = "veri";
function idb(){
  return new Promise((ok, no) => {
    const r = indexedDB.open(DB_AD, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DEPO);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
// Hızlı açılış için veri iki parça saklanır: "son" (işler, km'ler — açılışta
// okunur) ve "agir" (bölge haritası resmi, itinerer çizimleri, genel KMZ /
// drone katmanları — gerektiğinde okunur).
async function idbOku(anahtar){
  const db = await idb();
  return await new Promise(ok => { const t = db.transaction(DEPO).objectStore(DEPO).get(anahtar); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); });
}
async function veriOku(){
  try{ return await idbOku("son"); }
  catch(e){ try{ return JSON.parse(localStorage.getItem("istakip-mobil-veri") || "null"); }catch(_){ return null; } }
}
function bol(v){
  const agir = { harita: v.harita || "", iti: v.iti || null, katman: v.katman || null, hResim: v.hResim || null, hResimOrtak: v.hResimOrtak || null };
  const kodlar = v.iti && v.iti.projeler ? Object.keys(v.iti.projeler) : (v.itiKodlar || []);
  const cekirdek = { ...v, harita: null, iti: null, katman: null, hResim: null, hResimOrtak: null, itiKodlar: kodlar, haritaVar: !!(v.harita || v.haritaVar), katmanVar: !!(v.katman || v.katmanVar), _parcali: 1 };
  return { cekirdek, agir };
}
async function veriYaz(v){
  const { cekirdek, agir } = bol(v);
  try{
    const db = await idb();
    await new Promise((ok, no) => { const t = db.transaction(DEPO, "readwrite"); const st = t.objectStore(DEPO); st.put(cekirdek, "son"); st.put(agir, "agir"); t.oncomplete = ok; t.onerror = () => no(t.error); });
  }catch(e){ try{ localStorage.setItem("istakip-mobil-veri", JSON.stringify(v)); }catch(_){} }
}

let agirSoz = null;
function agirHazir(){
  if(!D || D._agirTam) return Promise.resolve();
  if(!agirSoz) agirSoz = idbOku("agir").then(a => {
    if(a){ D.harita = a.harita || ""; D.iti = a.iti || null; D.katman = a.katman || null; D.hResim = a.hResim || null; D.hResimOrtak = a.hResimOrtak || null; }
    D._agirTam = true;
  }).catch(() => { D._agirTam = true; });

}

  // leaflet-rotate: 2B'de iki parmakla döndürme

// Eski (1. sürüm) dosyalar da açılsın
// Excel başlığı tamamı büyük harfse Türkçe kurala göre ilk harfler büyük;
// ABD biçimli sayılar Türkçe biçime (yalnız eski dosyalarda gerekir)
function baslikGuzel(h){
  const s = String(h || ""), harf = s.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g, "");
  if(!harf || harf !== harf.toLocaleUpperCase("tr-TR")) return s;
  return s.split(/(\([^)]*\))/).map(p => p.startsWith("(") ? p : p.toLocaleLowerCase("tr-TR").replace(/(^|[\s\-/.])([a-zçğıöşü])/g, (m, a, b) => a + b.toLocaleUpperCase("tr-TR"))).join("");
}
function trSayi(v){
  const s = String(v ?? "").trim(), m = s.match(/^(-?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?(%?)$/);
  if(!m) return s;
  const [, e, t, o, y] = m;
  if(!y && !o && !t.includes(",")) return s;
  const r = e + t.replace(/,/g, ".") + (o ? "," + o : "");
  return y ? "%" + r : r;
}
function duzelt(v){
  if(!(v.v >= 3)) (v.isler || []).forEach(j => { if(Array.isArray(j.ek)) j.ek = j.ek.map(([b, x]) => [baslikGuzel(b), trSayi(x)]); });
  (v.isler || []).forEach(j => {
    j.il = j.il || []; j.cats = j.cats || []; j.kmler = j.kmler || [];

const HIK_RENK = ["linear-gradient(165deg,#7c2d12,#1e1b2e 60%,#0b1020)", "linear-gradient(165deg,#1e3a8a,#111827 60%,#0b1020)", "linear-gradient(165deg,#14532d,#111827 60%,#0b1020)", "linear-gradient(165deg,#581c87,#111827 60%,#0b1020)", "linear-gradient(165deg,#0f766e,#111827 60%,#0b1020)"];
let hikD = null;
function hikayeAc(i){

  document.body.appendChild(v);

function hikGoster(i){
  if(!hikD) return;
  if(i < 0) i = 0;
  if(i >= hikD.l.length){ hikKapat(); return; }
  hikD.i = i; hikD.p = 0;

  [...document.getElementById("hikser").children].forEach((s, n) => { s.firstChild.style.width = n < i ? "100%" : "0"; });

    const yz = v => 4 + (v - lo) / w * 92;

  }
  const c = j.cats.find(cc => cc.ad === k.s);
  document.getElementById("hikic").innerHTML = `<div class="km">${f2(x.km)}<small>km</small></div><div class="ad">${esc(j.ad)}</div><div class="ar">${esc(k.a)} – ${esc(k.e)}${k.y ? " · yarısı" : ""}${j.firma ? " · " + esc(j.firma) : ""}</div><div class="ch"><span>${esc(k.s || "")}</span>${c ? `<span>${D.yil}: ${f2(c.b)}${c.h > 0 ? " / " + f2(c.h) : ""} km</span>` : ""}</div>${mini}`;
}
function hikKare(n){

  if(!hikD.dur){ hikD.p += dt / 5; if(hikD.p >= 1){ hikGoster(hikD.i + 1); if(!hikD) return; } }

function havaEfekt(kod){
  const c = document.getElementById("dhhava"); if(!c) return;
  const [, tur] = HAVA_KOD(kod), sa = new Date().getHours(), gece = sa < 6 || sa >= 20;
  const mod = tur === "yagmur" || tur === "firtina" ? "yagmur" : tur === "kar" ? "kar" : tur === "gunes" ? (gece ? "acik" : "gunes") : tur === "parcali" ? (gece ? "acik" : "bulut") : "bulut";
  const g = c.getContext("2d"), d = Math.min(2, window.devicePixelRatio || 1);
  const W = c.width = c.clientWidth * d, H = c.height = c.clientHeight * d;
  const n = { yagmur: 25, kar: 18, bulut: 3, gunes: 0, acik: 24 }[mod];
  const P = Array.from({ length: n }, (_, i) => ({ x: Math.random() * W, y: Math.random() * H, v: .7 + Math.random() * .5, r: Math.random(), f: Math.random() * 6, i }));
  const t0 = performance.now(); let son = 0;
  const kare = t => {
    if(!document.body.contains(c)) return;
    const dt = Math.min(.05, (t - (son || t)) / 1000); son = t;
    const gec = (t - t0) / 1000, s = (gec < 4 ? 1 : Math.max(.28, 1 - (gec - 4) / 2.5)) * Math.min(1, gec / .8);
    g.clearRect(0, 0, W, H);
    if(mod === "yagmur"){ g.strokeStyle = `rgba(190,210,235,${.3 * s})`; g.lineWidth = d * .8; g.lineCap = "round"; g.beginPath();
      P.forEach(p => { p.y += 260 * p.v * dt * d; p.x -= 22 * dt * d; if(p.y > H + 10){ p.y = -14 * d; p.x = Math.random() * W * 1.1; } g.moveTo(p.x, p.y); g.lineTo(p.x + 1.5 * d, p.y - 11 * d); }); g.stroke(); }
    else if(mod === "kar"){ P.forEach(p => { p.y += 16 * p.v * dt * d; p.x += Math.sin(t / 1600 + p.f) * .18 * d; if(p.y > H + 6){ p.y = -6 * d; p.x = Math.random() * W; } g.fillStyle = `rgba(255,255,255,${(.35 + p.r * .3) * s})`; g.beginPath(); g.arc(p.x, p.y, (1.2 + p.r * 1.6) * d, 0, 7); g.fill(); }); }
    else if(mod === "bulut"){ P.forEach(p => { p.x += (5 + p.i * 3) * dt * d; const w = (150 + p.i * 50) * d; if(p.x > W + w) p.x = -w; const y = (30 + p.i * 46) * d;
      const rg = g.createRadialGradient(p.x, y, 0, p.x, y, w * .6); rg.addColorStop(0, `rgba(226,232,240,${.13 * s + .03})`); rg.addColorStop(1, "rgba(226,232,240,0)"); g.fillStyle = rg; g.beginPath(); g.ellipse(p.x, y, w * .6, w * .22, 0, 0, 7); g.fill(); }); }
    else if(mod === "gunes"){ const x = W * .92, y = H * .05, nf = .85 + .15 * Math.sin(t / 1800);
      const rg = g.createRadialGradient(x, y, 0, x, y, W * .55 * nf); rg.addColorStop(0, `rgba(255,205,140,${.32 * s + .06})`); rg.addColorStop(.5, `rgba(255,190,120,${.1 * s + .02})`); rg.addColorStop(1, "rgba(255,190,120,0)"); g.fillStyle = rg; g.fillRect(0, 0, W, H); }
    else P.forEach(p => { const a = (.25 + .35 * (.5 + .5 * Math.sin(t / 1400 + p.f))) * (p.r * .6 + .4); g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(p.x, p.y * .8, (.6 + p.r * .8) * d, 0, 7); g.fill(); });
    requestAnimationFrame(kare);
  };
  requestAnimationFrame(kare);
}

function tutar9(ham, yazi){

// Boyalı (KM girişi ya da itinererde bitmiş) aralıklarda: yolla aynı yönde ~40 m içinde kalan bütün KMZ çizgileri
// (renkli kopyalar ve KMZ'nin kendi beyazı) gizlenir; yol tek çizgi olarak yeniden çizilir: sol / sağ yarı eşit
// kalınlıkta (renkleri aynıysa tek tam çizgi), BY ise beyaz orta çizgi tam ortada. 20 m'den kısa boşluk ve renk
// kırıntıları yanındaki renge katılır (kesik görünmez). Yakınlaştırma sürerken de yarımlar yerinde kalır.
function kbCiz10(m, hedef, j, W, WB, o){
  o = o || {};
  const P = kbHesap9(j); if(!P.length) return false;
  const cz = (j.hat && j.hat.cizgi) || [], renkli = cz.filter(c => !c.i), beyaz = cz.filter(c => c.i);
  const lat0 = (P[0].p[0] || [0])[0] * Math.PI / 180, kx = 111320 * Math.cos(lat0), ky = 110540, xy = q => [q[1] * kx, q[0] * ky];
  // 1) yol yol, iki yanın renk aralıkları
  const yollar = new Map();
  P.forEach((s, i) => { if(!s.h) return; let y = yollar.get(s.h); if(!y) yollar.set(s.h, y = []); y.push({ a: s.c0, b: s.c1, yan: s.yan, r: s.r, i, by: s.by !== false }); });
  const bolgeler = [];   // { h, a, b, sol, sag }
  yollar.forEach((L, h) => {
    const xs = [...new Set(L.flatMap(x => [x.a, x.b]))].sort((a, b) => a - b), el = [];
    for(let k = 0; k < xs.length - 1; k++){ const a = xs[k], b = xs[k + 1]; if(b - a < 0.01) continue;
      let sol = null, sag = null, is = -1, ig = -1, by = false;
      L.forEach(x => { if(x.a <= a + 0.01 && x.b >= b - 0.01){ if(x.by) by = true; if(x.yan <= 0 && x.i > is){ is = x.i; sol = x.r; } if(x.yan >= 0 && x.i > ig){ ig = x.i; sag = x.r; } } });
      el.push({ a, b, sol, sag, by }); }
    // yan yana aynı olanları birleştir
    const bir = L2 => { const o2 = []; L2.forEach(x => { const s2 = o2[o2.length - 1]; if(s2 && s2.sol === x.sol && s2.sag === x.sag && Math.abs(s2.b - x.a) < 0.5) s2.b = x.b; else o2.push({ ...x }); }); return o2; };
    let g = bir(el);
    // 20 m'den kısa parçalar: iki yanı aynı ise ona, değilse uzun komşuya katılır
    for(let tur = 0; tur < 3; tur++){
      for(let k = 0; k < g.length; k++){ const x = g[k]; if(x.b - x.a >= 20) continue; const o1 = g[k - 1], o3 = g[k + 1];
        const hedefK = o1 && o3 ? ((o1.sol === o3.sol && o1.sag === o3.sag) || (o1.b - o1.a) >= (o3.b - o3.a) ? o1 : o3) : (o1 || o3);
        if(hedefK && Math.abs((hedefK === o1 ? o1.b : o3.a) - (hedefK === o1 ? x.a : x.b)) < 0.5){ x.sol = hedefK.sol; x.sag = hedefK.sag; } }
      g = bir(g);
    }
    // boşluklar (iki boyalı aralık arasında 20 m'den az) kapatılır
    const dolu = g.filter(x => x.sol || x.sag);
    for(let k = 1; k < dolu.length; k++){ const a = dolu[k - 1], b = dolu[k]; if(b.a - a.b > 0 && b.a - a.b < 20) a.b = b.a; }
    dolu.forEach(x => bolgeler.push({ h, ...x }));
  });
  if(!bolgeler.length) return false;
  // 2) boyalı bölgelerin çizgisi ve gizleme koridoru
  const parcalar = [];   // { p, sol, sag }
  // parçaların km'si (yolun örneklerinden) — yollar arasındaki boşlukları doldurmak için
  let YY = []; try{ YY = kbYollar9(j); }catch(_){}
  const cKm = (h, c) => { const yo = YY.find(y => y.h === h); if(!yo) return null; const S = yo.S; let k = 0; while(k < S.length - 2 && S[k + 1].c < c) k++; const a = S[k], b = S[k + 1] || a; return b.c > a.c ? a.m + (b.m - a.m) * (c - a.c) / (b.c - a.c) : a.m; };
  bolgeler.forEach(b => kbParca9(b.h, b.a, b.b).forEach(p => { if(p.length > 1) parcalar.push({ p, sol: b.sol, sag: b.sag, by: b.by, m0: cKm(b.h, b.a), m1: cKm(b.h, b.b) }); }));
  const G = new Map(), H = 60, KOR = 40;
  parcalar.forEach((t, ti) => { for(let i = 1; i < t.p.length; i++){ const a = xy(t.p[i - 1]), b = xy(t.p[i]);
    const x1 = Math.floor((Math.min(a[0], b[0]) - KOR) / H), x2 = Math.floor((Math.max(a[0], b[0]) + KOR) / H), y1 = Math.floor((Math.min(a[1], b[1]) - KOR) / H), y2 = Math.floor((Math.max(a[1], b[1]) + KOR) / H);
    for(let gx = x1; gx <= x2; gx++) for(let gy = y1; gy <= y2; gy++){ const k = gx + "," + gy; let L2 = G.get(k); if(!L2) G.set(k, L2 = []); L2.push([a, b, ti, i === 1, i === t.p.length - 1]); } } });
  const ortu = (q, d) => {   // q noktası (yönü d) boyalı koridorda mı
    const Pq = xy(q), L2 = G.get(Math.floor(Pq[0] / H) + "," + Math.floor(Pq[1] / H)); if(!L2) return false;
    const dl = Math.hypot(d[0], d[1]) || 1;
    for(const [a, b, t, ilk, son] of L2){ const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy; let u = l ? ((Pq[0] - a[0]) * dx + (Pq[1] - a[1]) * dy) / l : 0;
      if(u < -0.05 || u > 1.05) continue; u = Math.max(0, Math.min(1, u));   // yalnız parçanın yanında; ucundan öteye taşmaz
      if(Math.hypot(Pq[0] - a[0] - u * dx, Pq[1] - a[1] - u * dy) > KOR) continue;
      const cos = Math.abs(dx * d[0] + dy * d[1]) / ((Math.sqrt(l) || 1) * dl); if(cos > 0.8) return true; }
    return false;
  };
  // bir çizgiyi görünen parçalarına ayır (gizli / açık; 20 m'den kısa açık kırıntılar da gizlenir)
  const ayir = c => {
    const S = [];
    for(let i = 0; i < c.p.length; i++){
      const q = c.p[i];
      if(i){ const A = xy(c.p[i - 1]), B = xy(q), d = [B[0] - A[0], B[1] - A[1]], n = Math.min(600, Math.ceil(Math.hypot(d[0], d[1]) / 5));
        for(let k = 1; k < n; k++){ const t = k / n, r = [c.p[i - 1][0] + (q[0] - c.p[i - 1][0]) * t, c.p[i - 1][1] + (q[1] - c.p[i - 1][1]) * t]; S.push([r, ortu(r, d)]); } }
      const a = xy(c.p[Math.max(0, i - 1)]), b = xy(c.p[Math.min(c.p.length - 1, i + 1)]); S.push([q, ortu(q, [b[0] - a[0], b[1] - a[1]])]);
    }
    // açık kısa koşular (≤ 4 örnek ≈ 20 m) iki gizli arasında ise gizle
    let k = 0; while(k < S.length){ if(S[k][1]){ k++; continue; } let e = k; while(e < S.length && !S[e][1]) e++; if(k > 0 && e < S.length && e - k <= 4) for(let z = k; z < e; z++) S[z][1] = true; k = e; }
    const out = []; let cur = null;
    const orta = (u, v) => [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2];
    S.forEach(([q, g], idx) => {
      if(g){ if(cur){ cur.push(orta(S[idx - 1][0], q)); if(cur.length > 1) out.push(cur); } cur = null; }
      else { if(!cur){ cur = []; if(idx) cur.push(orta(S[idx - 1][0], q)); } cur.push(q); }
    });
    if(cur && cur.length > 1) out.push(cur);
    return out;
  };
  const ortak = { opacity: o.op == null ? 1 : o.op, ...(o.isId ? { isId: o.isId } : {}) };
  const ekle = ly => { if(o.tik) ly.on("click", o.tik); ly.addTo(hedef); return ly; };
  // 3) KMZ'nin renkli çizgileri (boyalı koridor dışı). v132: iki boyalı parçanın ucunu birleştiren kısa açık parça
  // (km'si hiçbir yolun km'sine düşmeyen ara parça, ör. ana yolun sonu ile devam eden yolun ilk km etiketi arası)
  // aynı KM / itinerer aralığının içindeyse o da boyalı sayılır, kendi geometrisiyle boyanır.
  const KMx = (j._kb9 && j._kb9.km) || [], dolgu = [], RK = kbRenk9(j);
  // açık parçanın ucu hangi boyalı parçaya değiyor (parçanın herhangi bir noktasına 45 m'den yakın; en yakın uç km'si)
  const ucBul = q => { let en = null, ed = 45; const Q = xy(q);
    parcalar.forEach(t => { for(let i = 0; i < t.p.length; i++){ const A = xy(t.p[i]), d = Math.hypot(A[0] - Q[0], A[1] - Q[1]); if(d < ed){ ed = d;
      const uc = i < t.p.length / 2 ? t.m0 : t.m1; en = { mv: uc, t }; } } }); return en; };
  const yanRenk = (lo, hi, yanIst) => { let r = null; KMx.forEach(x => { const a = Math.min(x.a, x.e), e = Math.max(x.a, x.e); if(a > lo + 60 || e < hi - 60) return;
    const ty = /^TY/i.test(x.k.s || "") || koyYolu9(j), t2 = !ty && x.k.y ? taraf9(x.k.ac) : null, yan = t2 === "SOL" ? -1 : t2 === "SAG" ? 1 : 0;
    if(yan === 0 || yan === yanIst) r = RK[x.yil === D.yil ? "buyil" : "eski"]; }); return r; };
  renkli.forEach(c => ayir(c).forEach(p => {
    let uz = 0; for(let i = 1; i < p.length; i++){ const A = xy(p[i - 1]), B = xy(p[i]); uz += Math.hypot(B[0] - A[0], B[1] - A[1]); }
    const u0 = uz < 2500 ? ucBul(p[0]) : null, u1 = u0 ? ucBul(p[p.length - 1]) : null;
    if(u0 && u1 && u0.t !== u1.t){
      // (a) aradaki km aralığı tek bir KM / itinerer aralığının içinde
      if(u0.mv != null && u1.mv != null){
        const lo = Math.min(u0.mv, u1.mv), hi = Math.max(u0.mv, u1.mv), sol = yanRenk(lo, hi, -1), sag = yanRenk(lo, hi, 1);
        if(sol || sag){ dolgu.push({ p, sol, sag, by: u0.t.by || u1.t.by }); return; }
      }
      // (b) iki yandaki boyalı parça aynı renkte ve ikisi de AYNI KM / itinerer aralığından geliyor (aralık ikisine de uzanıyor)
      const ayniKaynak = KMx.some(x => { const a = Math.min(x.a, x.e), e = Math.max(x.a, x.e);
        const ust = t => t.m0 != null && t.m1 != null && Math.min(e, Math.max(t.m0, t.m1)) - Math.max(a, Math.min(t.m0, t.m1)) > 5; return ust(u0.t) && ust(u1.t); });
      if(ayniKaynak && u0.t.sol === u1.t.sol && u0.t.sag === u1.t.sag && uz < 1500){ dolgu.push({ p, sol: u0.t.sol, sag: u0.t.sag, by: u0.t.by || u1.t.by }); return; }
    }
    ekle(L.polyline(p, { ...ortak, color: c.r, weight: W, lineCap: "butt", lineJoin: "round" }));
  }));
  dolgu.forEach(d => parcalar.push(d));
  // 4) boyalı parçalar — boyasız yarı: yakındaki KMZ çizgisinin rengi
  // boyasız yarı her zaman "yapılacak" mavisi (KMZ'deki maviye en yakın renk; yoksa standart mavi)
  const MAVI = (() => { let en = 1e9, r = "#1e40ff"; renkli.forEach(c => { const m2 = /^#?([0-9a-f]{6})$/i.exec(String(c.r || "").trim()); if(!m2) return; const n = parseInt(m2[1], 16), R = n >> 16, Gc = (n >> 8) & 255, B = n & 255;
    if(B < 120 || B < R + 60) return; const d = Math.hypot(R - 30, Gc - 64, B - 255); if(d < en){ en = d; r = c.r; } }); return r; })();
  const yarim = [];
  parcalar.forEach(t => {
    const sol = t.sol || MAVI, sag = t.sag || MAVI;
    if(sol === sag) ekle(L.polyline(t.p, { ...ortak, color: sol, weight: W, lineCap: "round", lineJoin: "round" }));
    else [[-1, sol], [1, sag]].forEach(([y, r]) => { const ly = ekle(L.polyline(kbKaydir9(m, t.p, y * W / 4), { ...ortak, color: r, weight: W / 2, lineCap: "butt", lineJoin: "round", uc3bHam: t.p, uc3bOfs: y * W / 4 })); yarim.push([ly, t.p, y]); });
  });
  // 5) KMZ'nin beyazı (koridor dışı) + boyalı yerlerde tam ortada kendi beyazımız
  beyaz.forEach(c => ayir(c).forEach(p => ekle(L.polyline(p, { ...ortak, color: c.r, weight: WB, lineCap: "butt", lineJoin: "round" }))));
  parcalar.forEach(t => { if(t.by) ekle(L.polyline(t.p, { ...ortak, color: "#ffffff", weight: WB, lineCap: "round", lineJoin: "round" })); });
  // yarımlar yalnız yakınlaştırma BİTİNCE yeniden yerleşir (sürerken çizim yenilenirse tuval kayar)
  if(yarim.length){ const f = () => yarim.forEach(([ly, p, y]) => { try{ ly.setLatLngs(kbKaydir9(m, p, y * W / 4)); }catch(_){} }); m.on("zoomend", f); m.on("viewreset", f); }
  return true;
}

// v131: itinerer ↔ KMZ tek dokunuş. KMZ'den açıldıysa "KMZ" itinereri kapatır (KMZ aynı yerde durur);
// başka yerden açıldıysa itinerer kapanır ve işin KMZ'si açılır.
